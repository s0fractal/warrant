# SonarCloud configuration — warrant
#
# This is the configuration for a future CI-based SonarScanner invocation.
# The repository currently uses SonarCloud Automatic Analysis, which ignores
# this file.  Its active, deliberately smaller configuration lives in
# .sonarcloud.properties.
#
# Every exclusion below is a verified false-positive or CLI-by-design taint
# finding, scoped to an EXACT rule + file(s), each justified in the review
# recorded at commit time (see the PR description). This is not a blanket
# rule-disable: the rule stays active everywhere it is not listed here.
#
# Coverage is deliberately NOT wired: this project's assurance is
# conformance / differential / countervector / Lean (run `python3 tools/check.py`),
# not line coverage, and coverage is not a quality-gate condition. If a number is
# ever wanted, generate reports in CI and uncomment:
#   sonar.python.coverage.reportPaths=coverage.xml
#   sonar.go.coverage.reportPaths=cover.out

# Closed evidence snapshots are executed by repository-native gates but are not
# maintainable product sources. Their byte identities are operands: refactoring
# model output or the frozen runner would invalidate the evidence being kept.
sonar.exclusions=proposals/wrt-006-model/differential.py,proposals/wrt-007-model/installed_engine_check.py,proposals/wrt-007-model/release-evaluator-manifest.json,proposals/wrt-007-model/runtime-registry.json,needs/need-002-a3-base/audit-provenance.mjs,needs/need-002-a3-base/candidate/canon.mjs,needs/need-002-a3-base/candidate/hashing.mjs,needs/need-002-a3-base/candidate/main.mjs,needs/need-002-a3-base/candidate/parse.mjs,needs/need-002-a3-base/candidate/validate.mjs,needs/need-002-a3-base/candidate/verify-sig.mjs,needs/need-002-a3-base/candidate/verify-store.mjs,needs/need-002-a3-base/freeze-evidence.mjs,needs/need-002-a3-base/operands/warrant-conformance-1.2.0/run.py,needs/need-002-a3-base/operands/warrant-conformance-1.2.0/stub/mutate.py,needs/need-002-a3-base/provenance/a2c/orchestrate.mjs

sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7

# S8707 — a content-addressed verifier/CLI legitimately opens the store paths the
# operator points it at; "escape file system restrictions" is the user's own FS.
sonar.issue.ignore.multicriteria.e1.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.py

# S8705 — subprocess arg-lists (no shell=True): git calls and spawning the
# implementation-under-test. No shell injection is possible.
sonar.issue.ignore.multicriteria.e2.ruleKey=pythonsecurity:S8705
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.py

# S5443 — literal "/tmp/tv/bin/warrant ..." TEST-FIXTURE strings fed to the CLI
# parser in the release-surface check; nothing is written to /tmp.
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S5443
sonar.issue.ignore.multicriteria.e3.resourceKey=tools/check_release_surface.py

# S6096 — tar.addfile on the WRITE side; arcname from our own PACK.rglob paths,
# not an untrusted archive entry (the rule targets extraction).
sonar.issue.ignore.multicriteria.e4.ruleKey=pythonsecurity:S6096
sonar.issue.ignore.multicriteria.e4.resourceKey=tools/build_conformance_pack.py

# S2083 — CLI migration re-signs the operator's own store files at their own
# explicit paths; no privilege boundary is crossed.
sonar.issue.ignore.multicriteria.e5.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.e5.resourceKey=impl/warrant.py

# S7631 — pull_request_target checks out BASE; the candidate head is fetched as a
# git object and never executed. Long-standing accepted pattern.
sonar.issue.ignore.multicriteria.e6.ruleKey=githubactions:S7631
sonar.issue.ignore.multicriteria.e6.resourceKey=.github/workflows/agent-gate.yml

# S8544 — the composite action installs warrant-verify at a caller-chosen version
# ('latest' or pinned) — a deliberate input, not an unlocked dependency.
sonar.issue.ignore.multicriteria.e7.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.e7.resourceKey=action.yml

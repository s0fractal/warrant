# analysis for that exact commit still reported the finding. The directives were
# removed again rather than left inert.
#
# So `sonar.exclusions` / `sonar.cpd.exclusions` above are the only levers this
# file has. Rule-level dispositions are taken in the SonarCloud UI, which is how
# this project has in fact taken them: 30 issues stand resolved as

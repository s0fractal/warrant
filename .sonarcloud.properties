# WRT-013's two model scripts are evidence harnesses, not shipped code: each
# takes the Σ-GLYPH evaluator path as an EXPLICIT CLI operand, hashes it, and
# REFUSES unless the bytes match a pinned digest. Automatic Analysis reports
# `pythonsecurity:S8707` (path traversal from a CLI argument) on exactly that
# operand — the same class this project has already dispositioned 19 times in
# the SonarCloud UI, and the reason `sonar-project.properties` carries a written
# S8707 justification for `**/*.py`. Listing the two files here is the only
# lever that works under Automatic Analysis (see the measurement below).
# Scope: these two files. The rule stays active everywhere else, including on
# every runtime path in impl/ and tools/.

# These are immutable, byte-pinned snapshots of two adjacent Sigma editions.
# Their similarity is the compatibility evidence; deduplicating either file
# would change its digest.  Exclude only duplication accounting, not analysis.
sonar.cpd.exclusions=impl/sigma_glyph_v05.py,impl/sigma_glyph_v06.py


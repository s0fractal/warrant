# Active scope for SonarCloud Automatic Analysis.
#
# Since Warrant 3 no vendored or byte-pinned file remains in the tree (the Sigma copies and the
# dependency-audit encoder are at the tag history/warrant-2-2026-10-27), so no vendored copy is excluded from analysis.
#
# warrant_verify.py is generated from the package's modules (tools/build_verify.py; verify_test U36 holds it byte for
# byte), so its copies are not duplication.
sonar.cpd.exclusions=warrant_verify.py
#
# site/warrant.mjs is a link to impl-js/warrant.mjs (the page runs the engine the vectors hold; impl_js_test J10 holds
# the link): the file is analysed where it lies, not a second time as new code under site/.
sonar.exclusions=site/warrant.mjs

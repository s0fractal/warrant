# Active scope for SonarCloud Automatic Analysis.
#
# Automatic Analysis ignores sonar-project.properties and does not accept
# wildcard patterns here.  Keep this as a closed list of exact repository paths.
# WRT-006/WRT-007 and NEED-002-A3 are CLOSED evidence, not shipped/runtime
# product code. The A3 JavaScript and runner files are immutable model outputs
# or frozen operands: editing them to satisfy static style rules would destroy
# the identities the evidence record verifies. Repository-native gates execute
# every excluded file; the product verifier and mutation suite remain analyzed.

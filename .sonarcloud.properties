# Active scope for SonarCloud Automatic Analysis.
#
# Automatic Analysis ignores sonar-project.properties and does not accept
# wildcard patterns here.  Keep this as a closed list of exact repository paths.
# WRT-006/WRT-007 and NEED-002-A3 are CLOSED evidence, not shipped/runtime
# product code. The A3 JavaScript and runner files are immutable model outputs
# or frozen operands: editing them to satisfy static style rules would destroy
# the identities the evidence record verifies. Repository-native gates execute
# every excluded file; the product verifier and mutation suite remain analyzed.
sonar.exclusions=proposals/wrt-006-model/differential.py,proposals/wrt-007-model/installed_engine_check.py,proposals/wrt-007-model/release-evaluator-manifest.json,proposals/wrt-007-model/runtime-registry.json,needs/need-002-a3-base/audit-provenance.mjs,needs/need-002-a3-base/candidate/canon.mjs,needs/need-002-a3-base/candidate/hashing.mjs,needs/need-002-a3-base/candidate/main.mjs,needs/need-002-a3-base/candidate/parse.mjs,needs/need-002-a3-base/candidate/validate.mjs,needs/need-002-a3-base/candidate/verify-sig.mjs,needs/need-002-a3-base/candidate/verify-store.mjs,needs/need-002-a3-base/freeze-evidence.mjs,needs/need-002-a3-base/operands/warrant-conformance-1.2.0/run.py,needs/need-002-a3-base/operands/warrant-conformance-1.2.0/stub/mutate.py,needs/need-002-a3-base/provenance/a2c/orchestrate.mjs

# These are immutable, byte-pinned snapshots of two adjacent Sigma editions.
# Their similarity is the compatibility evidence; deduplicating either file
# would change its digest.  Exclude only duplication accounting, not analysis.
sonar.cpd.exclusions=impl/sigma_glyph_v05.py,impl/sigma_glyph_v06.py

# Rule exclusions. `sonar-project.properties` carries the full, wildcard-scoped
# set for a future CI-based scanner; Automatic Analysis does not read that file,
# so the entries that matter here are repeated with EXACT paths.
#
# Whether Automatic Analysis honours `sonar.issue.ignore.multicriteria` at all is
# not documented in this repository. This block is the experiment: if the S8707
# finding on `tools/pack_pdf.py` clears, it does; if it does not, that is a fact
# worth recording here rather than re-discovering.
sonar.issue.ignore.multicriteria=e1

# S8707 — same disposition this repository already recorded for its other CLIs
# in sonar-project.properties (e1 there): a writer CLI legitimately writes to the
# path its operator names, and "escape file system restrictions" is the user's
# own filesystem. `tools/pack_pdf.py` is additionally STRICTER than the files
# that exclusion was written for: the output path is resolved and confined to the
# working-directory tree, leaving it needs an explicit --allow-outside, a
# directory / missing parent / existing file are each refused, and all of it
# happens before the artifact is composed. The rule's taint analysis does not
# model that confinement.
sonar.issue.ignore.multicriteria.e1.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.e1.resourceKey=tools/pack_pdf.py

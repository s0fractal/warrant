[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
# Warrant 2 (SPEC.md). A new distribution name on purpose: `warrant-verify`
# (<= 0.12.0) is the retired 0.x generation and keeps its own meaning.
name = "warrant-loops"
version = "2.0.0.dev0"
description = "Record transitions of work with their residual, close loops exactly, and hand the next agent a capsule instead of a transcript."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "s0fractal" }]
dependencies = ["cryptography>=41"]

[project.urls]
Homepage = "https://github.com/s0fractal/warrant"
Specification = "https://github.com/s0fractal/warrant/blob/master/SPEC.md"

[project.scripts]
warrant = "warrant.cli:main"

[tool.setuptools]
packages = ["warrant"]

[tool.setuptools.package-data]
# The pinned Sigma provider is data: it is executed only from checked bytes,
# never imported into the assessing process (warrant/compute.py).
warrant = ["provider/*.py", "provider/PIN.json"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
# Warrant 2 (SPEC.md). A new distribution name on purpose: `warrant-verify`
# (<= 0.12.0) is the retired 0.x generation and keeps its own meaning.
name = "warrant-graph"
version = "2.0.0.dev0"
description = "Record transitions of work with their residual, close loops exactly, and hand the next agent a capsule instead of a transcript."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "s0fractal" }]
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
# `compute` conditions need the Sigma provider (sigma_provider in the sigma-glyph
# distribution, released on PyPI as 0.8.0). Its provider identity is
# 0caff793d00dd798fa0af89517674c2ca562e1d517e7c969cc40617778c776c5; CI checks the installed bytes against it, since a version
# pin alone does not name bytes. Without it, attest and observe work and every
# REPLAYED basis is UNVERIFIED.
compute = ["sigma-glyph==0.8.0"]
# The thin stdio MCP front end of warrant_agent (`warrant-agent-mcp`), on the
# official Python SDK at one exact version.
mcp = ["mcp==2.3.0"]

[project.urls]
Homepage = "https://github.com/s0fractal/warrant"
Specification = "https://github.com/s0fractal/warrant/blob/master/SPEC.md"

[project.scripts]
warrant = "warrant.cli:main"
warrant-agent = "warrant_agent.cli:main"
warrant-agent-mcp = "warrant_agent.mcp_server:main"

[tool.setuptools]
packages = ["warrant", "warrant_agent"]

# The claims checker after merges (owner, 2026-11-13): on a runner, under the key claims-key.yml made, at master's
# tip, `warrant.claims replay` runs again only the claims none of whose acceptances names the files this commit holds
# for them (the import closure of their witnesses and mutants, docs/V3.md §15), and accepts what held. Its
# acceptances go to a pull request of verdicts only from claims/verdicts/<commit>, which CI re-executes at the commit
# each names (`claims verify`) and the merge gate merges (its verdicts-only rule). Nothing is pushed to master.
#
# The seed is in the environment of a job that runs master's tests: whoever can change master's code can read it.
# That is the gate's guard, the same as for every check; the key signs only `claims-checker` acceptances, which CI
# re-executes before they merge.
name: claims-replay

# It runs on master alone: on a push to master (the owner's merges), every two hours (the gate's merges start no push
# workflow) and by hand. No workflow_run: nothing of a pull request or a fork is ever checked out here.
on:
  push:
    branches: [master]
  schedule:
    - cron: '41 */2 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: claims-replay
  cancel-in-progress: false

jobs:
  replay:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: claims
    timeout-minutes: 300
    permissions:
      contents: write          # the branch of verdicts
      pull-requests: write     # its pull request
      actions: write           # dispatching ci.yml on it: a pull request opened with GITHUB_TOKEN starts no workflow
    env:
      GIT_AUTHOR_NAME: claims-checker
      GIT_AUTHOR_EMAIL: claims-checker@invalid
      GIT_COMMITTER_NAME: claims-checker
      GIT_COMMITTER_EMAIL: claims-checker@invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Signature library (exact version and hashes)
        run: python -m pip install --quiet --only-binary ':all:' --require-hashes -r .github/merge-gate-requirements.txt
      - name: Replay the claims whose files changed; accept what held
        id: replay
        env:
          SEED: ${{ secrets.WARRANT_CLAIMS_SEED }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          unchanged() { echo "changed=" >> "$GITHUB_OUTPUT"; }
          tip=$(git rev-parse HEAD)
          echo "tip=$tip" >> "$GITHUB_OUTPUT"
          # Until the key is made (claims-key.yml) and bound in the trust (a constitutional pull request on
          # .warrant/v3.json, merged by the gate after its window), nothing this run could sign would count: it says so
          # and ends green, rather than failing every two hours for a week.
          if [ -z "$SEED" ]; then
            echo "no WARRANT_CLAIMS_SEED in the environment claims yet (claims-key.yml has not run): nothing replayed" | tee -a "$GITHUB_STEP_SUMMARY"
            unchanged
            exit 0
          fi
          bound=$(printf '%s' "$SEED" | PYTHONPATH="$GITHUB_WORKSPACE" python -c '
          import json, sys
          from warrant.keys import Key
          pub = Key.from_seed_hex(sys.stdin.read()).public
          keys = json.load(open(".warrant/v3.json"))["trust"]["keys"].get("claims-checker", [])
          print("yes" if pub in keys else pub)')
          if [ "$bound" != "yes" ]; then
            echo "the runner key $bound is not yet bound to claims-checker in .warrant/v3.json at ${tip:0:12}: nothing replayed" | tee -a "$GITHUB_STEP_SUMMARY"
            unchanged
            exit 0
          fi
          # one pull request of acceptances at a time: a second at a newer tip, before the first merged, would accept
          # the same versions again. Only a branch of this repository counts: a fork's pull request named
          # claims/verdicts/* must not stop the checker (Codex on #367)
          open_=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq "[.[] | select(.head.ref | startswith(\"claims/verdicts/\")) | select(.head.repo.full_name == \"$GITHUB_REPOSITORY\") | .number] | length")
          if [ "$open_" != "0" ]; then
            echo "a pull request of acceptances is open: nothing replayed until it merges" | tee -a "$GITHUB_STEP_SUMMARY"
            unchanged
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "claims/verdicts/${tip:0:12}" >/dev/null; then
            echo "claims/verdicts/${tip:0:12} exists already: nothing to do at this commit" | tee -a "$GITHUB_STEP_SUMMARY"
            unchanged
            exit 0
          fi
          printf '%s\n' "$SEED" | PYTHONPATH="$GITHUB_WORKSPACE" python -m warrant.claims replay --key - | tee -a "$GITHUB_STEP_SUMMARY"
          rm -rf build
          if git diff --quiet -- .warrant; then unchanged; else echo "changed=1" >> "$GITHUB_OUTPUT"; fi
      - name: A pull request of the acceptances only
        if: steps.replay.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TIP: ${{ steps.replay.outputs.tip }}
        run: |
          set -euo pipefail
          branch="claims/verdicts/${TIP:0:12}"
          [ -z "$(git status --porcelain --untracked-files=all -- . ':!.warrant')" ]
          git switch -q -c "$branch"
          git add .warrant
          git commit -q -m "claims-checker: acceptances at ${TIP:0:12}"
          git push -q origin "$branch"
          gh pr create --base master --head "$branch" --title "claims-checker: acceptances at ${TIP:0:12}" \
            --body "The claims checker's acceptances at $TIP, made by claims-replay.yml on a runner. CI re-executes each at that commit (claims verify); the merge gate merges verdicts only."
          gh workflow run ci.yml --ref "$branch"

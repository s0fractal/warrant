# The merge gate's key on a runner (merge-on-acceptance.yml, job `receipt`; warrant/receipt.py). Made once on a GitHub
# runner and kept as the secret WARRANT_GATE_SEED of the environment `gate`, which only master may deploy to. The seed
# never leaves GitHub; this run prints only its public key. No trust of this repository binds it: the gate's store of
# receipts (the branch `receipts`) names it, and that store gives nobody a role. Making the secret takes
# WARRANT_SECRETS_TOKEN in the environment `gate` (a fine-grained token of the owner's, of this repository only, with
# Environments: read and write), needed once and deleted after.
name: gate-key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  key:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: gate
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Signature library (exact version and hashes)
        run: python -m pip install --quiet --only-binary ':all:' --require-hashes -r .github/merge-gate-requirements.txt
      - name: Make the key once; print its public key
        env:
          SEED: ${{ secrets.WARRANT_GATE_SEED }}
          GH_TOKEN: ${{ secrets.WARRANT_SECRETS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SEED" ]; then
            if [ -z "$GH_TOKEN" ]; then
              echo "the environment gate holds neither WARRANT_GATE_SEED nor WARRANT_SECRETS_TOKEN" >&2
              exit 1
            fi
            # no key for an environment other branches could deploy to: their workflows would read it
            custom=$(gh api "repos/$GITHUB_REPOSITORY/environments/gate" --jq '.deployment_branch_policy.custom_branch_policies')
            branches=$(gh api "repos/$GITHUB_REPOSITORY/environments/gate/deployment-branch-policies" \
              --jq '[.branch_policies[] | [.name, .type]]' | tr -d ' \n')
            if [ "$custom" != "true" ] || [ "$branches" != '[["master","branch"]]' ]; then
              echo "refused: the environment gate must be deployable from master alone (custom $custom, $branches)" >&2
              exit 1
            fi
            SEED=$(python -c "import os; print(os.urandom(32).hex())")
            echo "::add-mask::$SEED"
            printf %s "$SEED" | gh secret set WARRANT_GATE_SEED --env gate --repo "$GITHUB_REPOSITORY"
            echo "made WARRANT_GATE_SEED in the environment gate; WARRANT_SECRETS_TOKEN may be deleted now"
          fi
          printf %s "$SEED" | PYTHONPATH="$GITHUB_WORKSPACE" python -c \
            "import sys; from warrant.keys import Key; print('merge-gate public key', Key.from_seed_hex(sys.stdin.read()).public)" \
            | tee -a "$GITHUB_STEP_SUMMARY"

name: merge-on-acceptance

# Merges a pull request the review loop has accepted, or one whose solo window passed (.warrant/merge.json),
# with no owner act; and comments once, naming the owner, when a constitutional window opens (tools/gate.py states the
# predicate and the GitHub side, docs/V3.md §14). Only trusted code runs here: this
# file and tools/gate.py are the base branch's (workflow_run and schedule always run the default branch's
# workflow; a dispatch from another ref is refused below), the working tree is the base branch at the
# exact commit GitHub reports for it, and every pull request head is fetched as Git objects into
# refs/warrant-gate/pull/<n>, read with git ls-tree / cat-file / diff-tree, never checked out,
# installed or run.
#
# At most one merge per run, with a merge commit, bound to the head assessed (GitHub refuses the
# merge when the head moved). A merge made with GITHUB_TOKEN starts no push workflow, so the gate
# then dispatches the required workflow (ci.yml) on master: master CI still runs
# after every merge this gate makes; the dispatched runs show as workflow_dispatch on master.
#
# Holds, controlled by the owner without code:
#   - the label `hold` on a pull request (.warrant/merge.json hold_label): that pull request is not merged;
#   - the repository variable WARRANT_MERGE_GATE=hold (Settings > Secrets and variables > Actions >
#     Variables, or `gh variable set WARRANT_MERGE_GATE --body hold`): nothing is merged;
#   - `gh workflow disable merge-on-acceptance.yml`: the gate does not run.
# Every refusal reason of every open pull request is written to the job summary.
#
# After a merge, the job `receipt` files the gate's receipt of it (warrant/receipt.py): one record signed by the key of
# the actor `merge-gate` (secret WARRANT_GATE_SEED of the environment `gate`, deployable from master alone, made once by
# gate-key.yml), in a store of its own on the branch `receipts` that gives nobody a role. Only after GitHub's pull
# request and merge commit agree with the gate's account of the merge. Without the seed it files nothing and says so.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: merge-on-acceptance
  cancel-in-progress: false

jobs:
  gate:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      base: ${{ steps.base.outputs.base }}
      receipt: ${{ steps.assess.outputs.receipt }}
    permissions:
      contents: write          # the merge
      pull-requests: write     # the merge
      issues: write            # the one comment when a constitutional window opens (warrant/gate.py notify)
      checks: read             # the required checks at a pull request's head
      actions: write           # the runs behind those checks; dispatching master CI after a merge
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      # No checkout action: master is fetched by hand and checked out at the id GitHub reports for
      # it, so the code running is that commit's, whole, and nothing of a pull request is checked out.
      - name: The code running is master's tip on GitHub, and only it
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tip=$(gh api "repos/$GITHUB_REPOSITORY/branches/master" --jq .commit.sha)
          [[ "$tip" =~ ^[0-9a-f]{40}$ ]]
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch -q --no-tags origin "+refs/heads/master:refs/remotes/origin/master"
          if [ "$(git rev-parse refs/remotes/origin/master)" != "$tip" ]; then
            echo "master moved while it was fetched: nothing assessed; a later run reads it." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git checkout -q --detach "$tip"
          [ -z "$(git status --porcelain --untracked-files=all)" ]
          echo "base=$tip" >> "$GITHUB_OUTPUT"

      - name: Signature verification library (exact version and hashes)
        if: steps.base.outputs.base != ''
        run: python -m pip install --quiet --only-binary ':all:' --require-hashes -r .github/merge-gate-requirements.txt

      - name: Assess the open pull requests; merge one that is eligible
        id: assess
        if: steps.base.outputs.base != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.base.outputs.base }}
          GATE_VAR: ${{ vars.WARRANT_MERGE_GATE }}
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" python tools/gate.py gate --base "$BASE" --merge \
            --gate-var "$GATE_VAR" --summary "$GITHUB_STEP_SUMMARY" --receipt "$RUNNER_TEMP/receipt.json"
          if [ -s "$RUNNER_TEMP/receipt.json" ]; then
            echo "receipt=$(cat "$RUNNER_TEMP/receipt.json")" >> "$GITHUB_OUTPUT"   # one line: the gate writes it with no newline
          fi

  # The receipt of the merge the job `gate` made. Its code is the base the gate ran, checked out at that commit; the
  # merge is read again from GitHub and filed only when the three accounts agree (warrant/receipt.py). The seed is in
  # the environment of a job that runs master's code: whoever can change master's code can read it, which is the
  # gate's own guard. A key that leaked states merges in a store that counts for nothing; each names its merge commit.
  receipt:
    needs: gate
    if: needs.gate.outputs.receipt != ''
    runs-on: ubuntu-latest
    environment: gate
    timeout-minutes: 10
    permissions:
      contents: write          # the branch receipts
      pull-requests: read      # the pull request as GitHub reports it
    env:
      GIT_AUTHOR_NAME: merge-gate
      GIT_AUTHOR_EMAIL: merge-gate@invalid
      GIT_COMMITTER_NAME: merge-gate
      GIT_COMMITTER_EMAIL: merge-gate@invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.base }}
          path: code
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Signature library (exact version and hashes)
        run: python -m pip install --quiet --only-binary ':all:' --require-hashes -r code/.github/merge-gate-requirements.txt
      - name: File the receipt on the branch receipts
        env:
          WARRANT_GATE_SEED: ${{ secrets.WARRANT_GATE_SEED }}
          GH_TOKEN: ${{ github.token }}
          RECEIPT: ${{ needs.gate.outputs.receipt }}
        run: |
          set -euo pipefail
          if [ -z "$WARRANT_GATE_SEED" ]; then
            echo "The gate has no key yet (the environment gate holds no WARRANT_GATE_SEED: gate-key.yml has not run). No receipt was filed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf %s "$RECEIPT" > "$RUNNER_TEMP/merge.json"
          read -r pr merge < <(python -c 'import json, sys; m = json.load(open(sys.argv[1])); assert type(m["pr"]) is int and m["pr"] > 0 and len(m["merge"]) == 40 and int(m["merge"], 16) >= 0; print(m["pr"], m["merge"])' "$RUNNER_TEMP/merge.json")
          gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" > "$RUNNER_TEMP/pull.json"
          gh api "repos/$GITHUB_REPOSITORY/commits/$merge" > "$RUNNER_TEMP/commit.json"
          gh auth setup-git
          tries=8
          for try in $(seq 1 "$tries"); do
            dir="receipts-$try"
            git init -q "$dir"
            git -C "$dir" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
            if git -C "$dir" fetch -q --depth 1 origin receipts; then
              git -C "$dir" checkout -q -b receipts FETCH_HEAD
            else
              git -C "$dir" checkout -q --orphan receipts
              printf '%s\n' "# The merge gate's receipts" "" \
                "Written by the job \`receipt\` of \`.github/workflows/merge-on-acceptance.yml\` (\`warrant/receipt.py\`): one record for each merge the gate made." \
                "Each record says that GitHub reports this pull request merged as this commit from this head, signed by the key of \`merge-gate\`. No rule of any store counts it." > "$dir/README.md"
            fi
            set +e
            PYTHONPATH="$GITHUB_WORKSPACE/code" python -m warrant.receipt file --merge "$RUNNER_TEMP/merge.json" \
              --pull "$RUNNER_TEMP/pull.json" --commit "$RUNNER_TEMP/commit.json" --repository "$GITHUB_REPOSITORY" \
              --store "$dir" > "$RUNNER_TEMP/out.json"
            rc=$?
            set -e
            if [ "$rc" != 0 ]; then
              echo "no receipt for #$pr (status $rc): $(cat "$RUNNER_TEMP/out.json")" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            git -C "$dir" add -A
            if git -C "$dir" diff --cached --quiet; then break; fi   # filed by an earlier run
            git -C "$dir" commit -q -m "receipt: #$pr merged as $merge"
            if git -C "$dir" push -q origin receipts; then break; fi
            if [ "$try" = "$tries" ]; then
              echo "the branch receipts moved under $tries tries in a row; no receipt was published for #$pr" >&2
              exit 1
            fi
            sleep $(( (RANDOM % (try * 3)) + 1 ))
          done
          echo "receipt for #$pr: $(cat "$RUNNER_TEMP/out.json")" >> "$GITHUB_STEP_SUMMARY"

name: conformance
on: [push, pull_request]

# ONE pin of the sibling repo, for the whole workflow. Symmetric to sigma-glyph's
# $WARRANT_PIN. A pin is what makes the conformance gate reproducible; it is not a
# substitute for testing against the sibling's HEAD, which is what
# tools/x1_cross_repo.sh does.
#
# WHAT THE PIN MEANS: a VERIFIED COMPATIBLE BASELINE — the sibling commit whose
# consumed surfaces this repo has been checked against — not "the sibling's
# latest". Being behind HEAD is the normal state and is not a defect.
#
# REFRESH ONLY when a surface this workflow consumes actually changes: Book I
# vectors or the evaluator, the ski@v1 runtime contract, the verify-report
# boundary, or the anchor-trust roster. Do NOT refresh because X1 reports drift;
# X1's drift report is context for a human, never a trigger. Treating "behind
# HEAD" as the trigger is a ping-pong generator, because merging the pin bump
# itself moves this repo's HEAD and so obliges the sibling to bump in reply,
# forever, over commits that changed nothing either side consumes.
#
# A refresh commit MUST cite the old and new sibling commits, name the consumed
# surface that changed, and include the conformance outputs run at the new pin.
env:
  SIGMA_PIN: c5ab2ab218bbeaaf4d80d2e49be2cc7b48fb7f37

jobs:
  test:
    # Codex v0.3 hardening audit P2-c: for a repo centered on reproducible
    # settlement, dependencies should be immutable. Actions are still pinned by
    # major tag below — pinning each by commit SHA is a tracked follow-up (the
    # exact digests are not guessed here to avoid a red build). `cryptography`
    # is bounded, and CI runs in strict mode so a skipped ski@v1 case fails.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - run: python3 -m pip install 'cryptography>=42,<46'
      - name: Conformance (SPEC s8 vectors, byte-exact)
        run: python3 impl/warrant.py conformance examples
      - name: Selftest (live round-trip + tamper detection)
        run: python3 impl/warrant.py selftest
      - name: Package smoke test (pip install . -> `warrant` CLI, bundled oracle, offline, any cwd)
        run: |
          python3 -m pip install .
          ( cd /tmp && warrant selftest )
          ( cd /tmp && warrant conformance "$GITHUB_WORKSPACE/examples" | grep -q "CONFORMANCE: ALL PASS" )
      - name: Evidence-pack guard (demo packs verify; ski re-executes; no private keys shipped)
        run: python3 tests/evidence_pack.py
      - name: MCP sealing proxy (classifier, sealer, stdio round-trip -> verifiable pack)
        run: python3 tests/mcp_seal.py
      - name: ski@v1 policy predicates (truth table, real re-execution, warrant integration)
        run: python3 tests/ski_policy.py
      - name: Merkle anchoring (RFC 6962 structure, inclusion proofs, store integration)
        run: python3 tests/anchor.py
      # Pin semantics and the refresh rule are at the top of this file.
      - name: ski@v1 runtime conformance (SPEC s8.2, oracle = sigma-glyph pinned)
        run: |
          git clone -q https://github.com/s0fractal/sigma-glyph /tmp/sigma-glyph
          git -C /tmp/sigma-glyph checkout -q "$SIGMA_PIN"
          SIGMA_GLYPH=/tmp/sigma-glyph/impl python3 impl/warrant.py conformance examples | grep -q "ski: re-run -> pass"
      - name: Build Go implementation
        run: cd impl-go && go build -o warrant-go .
      - name: Go conformance (second implementation)
        run: ./impl-go/warrant-go conformance examples
      # Exit status alone would accept the historical false pass: this command
      # once printed "ALL PASS (33/33 eval)" and exited 0 while skipping the 8
      # object and 8 deserialize vectors entirely. So the expected summary is
      # DERIVED from the pinned vector file — and matched with -x, ANCHORED to a
      # whole line. A substring match is forgeable: the producer prints one line
      # per vector and a vector's id is data, so an id equal to the expected text
      # satisfies a substring check while the real summary says something else.
      - name: Book I coverage assertion behaves (rejection matrix)
        run: python3 tools/book1_coverage.py --selftest
      - name: Go sigma-glyph conformance, exact coverage (pinned vectors)
        shell: bash
        run: |
          set -euo pipefail
          V=/tmp/sigma-glyph/tests/spec_conformance/vectors.json
          echo "expecting: $(python3 tools/book1_coverage.py "$V")"
          # --check, not grep: the rule is POSITIONAL (the summary must be the
          # transcript's last line) because a vector id may contain newlines and
          # can otherwise forge a standalone line anywhere above it. pipefail
          # binds the producer's own exit status into the same decision.
          ./impl-go/warrant-go sigma-conformance "$V" | tee /dev/stderr \
            | python3 tools/book1_coverage.py --check "$V"
      - name: Go selftest (schema and verification edges)
        run: ./impl-go/warrant-go selftest examples
      - name: Go verifies warrant store layout
        run: ./impl-go/warrant-go verify .warrants
      - name: Build Rust implementation (third impl)
        run: cd impl-rs && cargo build --release
      - name: Rust conformance (§8 WarrantIDs + signatures + §8.3 negatives; from-scratch SHA-256/Ed25519)
        run: ./impl-rs/target/release/warrant-rs conformance examples
      - name: Rust Ed25519 selftest (RFC 8032 TV1 + field/SHA-512)
        run: ./impl-rs/target/release/warrant-rs edtest
      - name: Ed25519 differential (Rust vs Python cryptography, multi-key)
        run: python3 tests/ed25519_differential.py --n 200
      - name: "Cross-implementation agreement: differential (PY/GO/RS) + negative + settlement (strict)"
        run: WARRANT_REQUIRE_SIGMA=1 SIGMA_GLYPH=/tmp/sigma-glyph/impl ./tests/agree_check.sh
      - name: Hostile-store hardening (cycles, malformed JSON, unverified ski; Python/Go agree)
        run: python3 tests/hostile.py
      - name: "Differential fuzzer (randomized PY/GO agreement over canon/verify, multi-seed)"
        run: |
          for s in 1337 4242 20240717; do
            python3 tests/fuzz_differential.py --iters 400 --seed "$s"
          done
      - name: Settlement-grade verification of the repo's own store
        run: |
          python3 impl/warrant.py verify --settlement --trust-config trust-config.json
          ./impl-go/warrant-go verify --settlement --trust-config trust-config.json .warrants
      # Catches docs that promise a subcommand or flag this tree does not have.
      # The publish workflow runs the same check against the built wheel, which
      # is where the promise actually reaches a stranger.
      - name: Documented CLI surface exists
        run: python3 tools/check_release_surface.py

name: ci

# Warrant 2. The job id `test` is a required status check on master; keep it.
#
# What runs: the package installed from this checkout into a clean virtualenv,
# the contract tests and mutants against those installed bytes, the five
# scenarios through the installed `warrant` command, and the Claude Code plugin
# bridge against the published warrant-verify 0.12.0 it uses.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install the package into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/pip" install --quiet .
          SITE=$("$RUNNER_TEMP/v/bin/python" -c 'import pathlib, warrant; print(pathlib.Path(warrant.__file__).parent.parent)')
          test -f "$SITE/warrant/provider/sigma_resume.py"
          echo "WARRANT_IMPL=$SITE" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/v/bin" >> "$GITHUB_PATH"

      - name: Contract, computation, conditions and primitives (installed bytes)
        working-directory: tests
        run: |
          for t in contract compute conditions primitives; do python "${t}_test.py"; done

      - name: Mutants (each critical rule must fail its own case)
        run: WARRANT_IMPL= python tests/mutants.py

      - name: Scenarios through the installed `warrant` command
        working-directory: ${{ runner.temp }}
        run: bash "$GITHUB_WORKSPACE/examples/run-all.sh"

      - name: Claude Code plugin bridge (Warrant 0.x format, published warrant-verify 0.12.0)
        run: |
          python -m venv "$RUNNER_TEMP/old"
          "$RUNNER_TEMP/old/bin/pip" install --quiet 'warrant-verify==0.12.0'
          WARRANT_PLUGIN_CLI="$RUNNER_TEMP/old/bin/warrant" python integrations/claude-code-plugin/test_plugin.py

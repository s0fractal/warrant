name: conformance
on: [push, pull_request]

# ONE pin of the sibling repo, for the whole workflow. Symmetric to sigma-glyph's
# $WARRANT_PIN. A pin is what makes the conformance gate reproducible; it is not a
# substitute for testing against the sibling's HEAD, which is what
# tools/x1_cross_repo.sh does.
#
# WHAT THE PIN MEANS: a VERIFIED COMPATIBLE BASELINE — the sibling commit whose
# consumed surfaces this repo has been checked against — not "the sibling's
# latest". Being behind HEAD is the normal state and is not a defect.
#
# REFRESH ONLY when a surface this workflow consumes actually changes: Book I
# vectors or the evaluator, the ski@v1 runtime contract, the verify-report
# boundary, or the anchor-trust roster. Do NOT refresh because X1 reports drift;
# X1's drift report is context for a human, never a trigger. Treating "behind
# HEAD" as the trigger is a ping-pong generator, because merging the pin bump
# itself moves this repo's HEAD and so obliges the sibling to bump in reply,
# forever, over commits that changed nothing either side consumes.
#
# A refresh commit MUST cite the old and new sibling commits, name the consumed
# surface that changed, and include the conformance outputs run at the new pin.
env:
  SIGMA_PIN: c5ab2ab218bbeaaf4d80d2e49be2cc7b48fb7f37

jobs:
  test:
    # Codex v0.3 hardening audit P2-c: for a repo centered on reproducible
    # settlement, dependencies should be immutable. Every action in this repo is
    # now pinned by commit SHA with the version in a trailing comment; the SHAs
    # were resolved from each upstream repository, not guessed, and each is the
    # commit the mutable tag pointed at when it was pinned. Read the comment as
    # a label, never as the authority — the SHA is what runs. `cryptography` is
    # bounded, and CI runs in strict mode so a skipped ski@v1 case fails.
    #
    # The cost is real and now half-watched: `.github/dependabot.yml` opens a
    # weekly pull request when a pinned action has a newer release, rewriting
    # both the SHA and the trailing comment. It notifies; it does not review and
    # it does not merge, so the bump is still deliberate and still a human's —
    # the same way SIGMA_PIN above is bumped. SIGMA_PIN itself is NOT in that
    # config's scope and does not want to be: it is a verified-compatible
    # baseline, not a version to chase, and x1-cross-repo.yml is already its
    # canary.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.22' }
      - run: >-
          python3 -m pip install --only-binary=:all:
          'cryptography==45.0.7' 'build==1.5.0'
          'setuptools==84.0.0' 'wheel==0.48.0' 'PyYAML==6.0.2'
      # The governance workflow (agent-gate.yml) was once unparseable YAML and
      # every run failed with no job. This step is MANDATORY — not run through
      # tools/check.py --allow-unrun, where a missing PyYAML would let it pass
      # as UNRUN — so a workflow that stops parsing fails CI here, loudly.
      - name: Workflows parse (mandatory — the governance gate cannot silently break)
        run: python3 tools/lint_workflows.py
      # CI has no sibling checkout, so it cannot re-resolve cross-repo citations.
      # It demands instead that every citation be ACCOUNTED FOR in the committed
      # MAP.md: cite a document nobody has located and the row is missing and
      # this fails. The first draft of this step ran `--check || true`, a step
      # that cannot fail -- the exact covering-less-than-it-claims shape the rest
      # of this file exists to catch, nearly added by the person catching it.
      - name: Reference map (every cited document is located in MAP.md)
        run: python3 tools/repo_map.py --check-map
      # The single entry point a reader is told to run. CI runs it too, so the
      # command in llms.txt cannot rot into something only the workflow does --
      # and an UNRUN check fails here rather than passing quietly.
      # A same-owner paired PR may test its sibling candidate; everything else
      # tests against the sibling's master HEAD. The first draft exported
      # github.head_ref on EVERY same-owner PR, and tools/x1_cross_repo.sh
      # (mirrored byte-for-byte with sigma-glyph, and strict about an explicit
      # ref on purpose) then tried to clone a sigma-glyph branch that only
      # existed here -- an ordinary one-sided PR turned the aggregate red
      # (PR #55). The existence probe is the same rule x1-cross-repo.yml
      # applies inline; tests/x1_sibling_ref.sh holds this file to it.
      - name: Resolve X1 sibling ref (paired candidate only if the sibling branch exists)
        env:
          X1_EVENT_NAME: ${{ github.event_name }}
          X1_PR_HEAD_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
          X1_PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          REF="$(bash tools/x1_sibling_ref.sh)"
          echo "X1_SIBLING_REF=$REF" >> "$GITHUB_ENV"
      - name: One command (tools/check.py, UNRUN is not a pass)
        run: python3 tools/check.py --allow-unrun
      - name: Conformance (SPEC s8 vectors, byte-exact)
        run: python3 impl/warrant.py conformance examples
      - name: Selftest (live round-trip + tamper detection)
        run: python3 impl/warrant.py selftest
      - name: Package smoke test (built wheel -> `warrant` CLI, bundled oracle, offline, any cwd)
        run: |
          python3 -m build --wheel --no-isolation --outdir /tmp/warrant-wheel
          python3 -m pip install --no-deps /tmp/warrant-wheel/warrant_verify-0.9.0-py3-none-any.whl
          ( cd /tmp && warrant selftest )
          ( cd /tmp && warrant conformance "$GITHUB_WORKSPACE/examples" | grep -q "CONFORMANCE: ALL PASS" )
      - name: Evidence-pack guard (demo packs verify; ski re-executes; no private keys shipped)
        run: python3 tests/evidence_pack.py
      # The same wheel the smoke test installed, replayed the way a stranger
      # would: fresh venv, cwd outside the checkout, nothing importable from
      # impl/, evaluator digest checked before anything runs. Per-record vector
      # plus the fail-closed controls (evaluator failure without fallback, root
      # and nested CAS identity). Exit 3 is a typed refusal, not a pass.
      - name: Evidence-pack replay (built wheel, clean venv, per-record vector + fail-closed controls)
        run: WARRANT_REPLAY_WHEEL=/tmp/warrant-wheel/warrant_verify-0.9.0-py3-none-any.whl bash demos/air-canada/replay-clean.sh
      - name: MCP sealing proxy (classifier, sealer, stdio round-trip -> verifiable pack)
        run: python3 tests/mcp_seal.py
      - name: ski@v1 policy predicates (truth table, real re-execution, warrant integration)
        run: python3 tests/ski_policy.py
      - name: Merkle anchoring (RFC 6962 structure, inclusion proofs, store integration)
        run: python3 tests/anchor.py

      - name: in-toto / DSSE projection (binding, PAE signature, tamper controls)
        run: python3 tools/intoto.py selftest

      - name: Agent gate isolation (a change must not be able to approve itself)
        run: python3 tests/gate_isolation.py
      # Pin semantics and the refresh rule are at the top of this file.
      - name: ski@v1 runtime conformance (SPEC s8.2, oracle = sigma-glyph pinned)
        run: |
          git clone -q https://github.com/s0fractal/sigma-glyph /tmp/sigma-glyph
          git -C /tmp/sigma-glyph checkout -q "$SIGMA_PIN"
          # Running warrant's ski@v1 against the PINNED SIBLING (an evaluator that
          # differs byte-wise from the bundled, provenance-bound one) is a
          # cross-repo DIFFERENTIAL — an unpinned oracle. It must be requested
          # explicitly: without WARRANT_SIGMA_DIFFERENTIAL=1 the re-executor
          # refuses an unpinned evaluator, and settlement refuses it regardless.
          SIGMA_GLYPH=/tmp/sigma-glyph/impl WARRANT_SIGMA_DIFFERENTIAL=1 \
            python3 impl/warrant.py conformance examples | grep -q "ski: re-run -> pass"
      - name: Build Go implementation
        run: cd impl-go && go build -o warrant-go .
      - name: Go conformance (second implementation)
        run: ./impl-go/warrant-go conformance examples
      - name: Go ski@v1 CAS identity (foreign key refused; Python mirror)
        run: cd impl-go && go test ./... -run TestSigmaCASIdentity -count=1
      # Exit status alone would accept the historical false pass: this command
      # once printed "ALL PASS (33/33 eval)" and exited 0 while skipping the 8
      # object and 8 deserialize vectors entirely. So the expected summary is
      # DERIVED from the pinned vector file — and matched with -x, ANCHORED to a
      # whole line. A substring match is forgeable: the producer prints one line
      # per vector and a vector's id is data, so an id equal to the expected text
      # satisfies a substring check while the real summary says something else.
      - name: Book I coverage assertion behaves (rejection matrix)
        run: python3 tools/book1_coverage.py --selftest
      - name: Go sigma-glyph conformance, exact coverage (pinned vectors)
        shell: bash
        run: |
          set -euo pipefail
          V=/tmp/sigma-glyph/tests/spec_conformance/vectors.json
          echo "expecting: $(python3 tools/book1_coverage.py "$V")"
          # --check, not grep: the rule is POSITIONAL (the summary must be the
          # transcript's last line) because a vector id may contain newlines and
          # can otherwise forge a standalone line anywhere above it. pipefail
          # binds the producer's own exit status into the same decision.
          ./impl-go/warrant-go sigma-conformance "$V" | tee /dev/stderr \
            | python3 tools/book1_coverage.py --check "$V"
      - name: Go selftest (schema and verification edges)
        run: ./impl-go/warrant-go selftest examples
      - name: Go verifies warrant store layout
        run: ./impl-go/warrant-go verify .warrants
      - name: Build Rust implementation (third impl)
        run: cd impl-rs && cargo build --release --locked
      - name: Rust conformance (§8 WarrantIDs + signatures + §8.3 negatives; from-scratch SHA-256/Ed25519)
        run: ./impl-rs/target/release/warrant-rs conformance examples
      - name: Rust Ed25519 selftest (RFC 8032 TV1 + field/SHA-512)
        run: ./impl-rs/target/release/warrant-rs edtest
      - name: Ed25519 differential (Rust vs Python cryptography, multi-key)
        run: python3 tests/ed25519_differential.py --n 200
      # SIGMA_GLYPH here points at the pinned sibling (unpinned vs the bundled
      # evaluator), so this cross-repo/cross-impl differential — settlement math
      # included — is requested explicitly with WARRANT_SIGMA_DIFFERENTIAL=1. In
      # production (no such flag) an unpinned override is refused, and settlement
      # refuses it outright.
      - name: "Cross-implementation agreement: differential (PY/GO/RS) + negative + settlement (strict)"
        run: WARRANT_REQUIRE_SIGMA=1 SIGMA_GLYPH=/tmp/sigma-glyph/impl WARRANT_SIGMA_DIFFERENTIAL=1 ./tests/agree_check.sh
      - name: Hostile-store hardening (cycles, malformed JSON, unverified ski; Python/Go agree)
        run: python3 tests/hostile.py
      - name: "Differential fuzzer (randomized PY/GO agreement over canon/verify, multi-seed)"
        run: |
          for s in 1337 4242 20240717; do
            python3 tests/fuzz_differential.py --iters 400 --seed "$s"
          done
      - name: Settlement-grade verification of the repo's own store
        run: |
          python3 impl/warrant.py verify --settlement --trust-config trust-config.json
          ./impl-go/warrant-go verify --settlement --trust-config trust-config.json .warrants
      # Catches docs that promise a subcommand or flag this tree does not have.
      # The publish workflow runs the same check against the built wheel, which
      # is where the promise actually reaches a stranger.
      # The matching rule gets its own rejection matrix, for the same reason the
      # coverage assertion did: a flag check that matches substrings accepts a
      # documented `--js` because the CLI offers `--json`.
      - name: Documented CLI surface exists
        run: |
          python3 tools/check_release_surface.py --selftest
          python3 tools/check_release_surface.py

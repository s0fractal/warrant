name: ci

# Warrant 3. The check named `test` is required on master; it is the last job below, which needs every
# other job and fails unless each one succeeded and the mutant parts together ran every mutant once and
# killed it on its own case. Keep its name.
#
# Jobs, all on ubuntu-latest:
#   wheels    builds the wheelhouse once (warrant from this checkout, the pinned MCP SDK, the pilot's
#             sigma-glyph) and publishes its digest; every other job installs from it, checked;
#   suites    lint, the core, the agent interface (stdio MCP included), the merge gate, the tools,
#             the shapes and primitives, the pilot, the public surface and the executable
#             QUICKSTART.md, the Codex plugin and its waker, the Claude Code plugin bridge;
#   mutants   tests/mutants.py in four parts (--shard K/4), each checking its targets' baseline first;
#   replay    tools/review.py verify and tools/claims.py verify: the review replays and the claims
#             checker's acceptances new since the base, re-executed at their commits, each refused when
#             its `code` is not the checker's code there (needs the history);
#   test      the parts merged (refused unless every mutant ran exactly once and was killed), then
#             the claims, the roadmap and the pilot contract against this tree, and the views of the
#             records rendered three times and compared (build artifacts, uploaded as `views`).
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.wh.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Wheelhouse (warrant from this checkout, the MCP SDK, sigma-glyph from the pinned release)
        id: wh
        run: |
          set -euo pipefail
          python -m pip wheel --quiet --no-deps -w "$RUNNER_TEMP/wh" .
          python -m pip download --quiet -d "$RUNNER_TEMP/wh" 'cryptography>=41' 'mcp==2.3.0' 'sigma-glyph==0.8.0'
          cd "$RUNNER_TEMP/wh"
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" .
          cat SHA256SUMS
          echo "digest=$(sha256sum < SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheelhouse
          path: ${{ runner.temp }}/wh
          if-no-files-found: error
          retention-days: 3

  suites:
    needs: wheels
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: ./.github/actions/install
        with:
          digest: ${{ needs.wheels.outputs.digest }}

      - name: Lint (pyflakes rules)
        run: |
          python -m pip install --quiet --only-binary ':all:' 'ruff==0.17.3'
          python -m ruff check --select F warrant warrant_agent warrant_pilot tools tests integrations/codex-plugin

      - name: The core, the agent interface, the merge gate, the tools
        working-directory: tests
        run: for t in core agent gate tools shapes primitives pilot; do python "${t}_test.py"; done

      - name: The public surface and the quickstart
        working-directory: tests
        run: for t in boundary quickstart; do python "${t}_test.py"; done

      - name: Codex plugin and review waker (manifests, launcher, one wake per head, the waker's store rules)
        run: python integrations/codex-plugin/test_plugin.py

      - name: Claude Code plugin bridge (Warrant 0.x format, published warrant-verify 0.12.0)
        run: |
          python -m venv "$RUNNER_TEMP/old"
          "$RUNNER_TEMP/old/bin/pip" install --quiet 'warrant-verify==0.12.0'
          WARRANT_PLUGIN_CLI="$RUNNER_TEMP/old/bin/warrant" python integrations/claude-code-plugin/test_plugin.py

  replay:
    needs: wheels
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: ./.github/actions/install
        with:
          digest: ${{ needs.wheels.outputs.digest }}

      # A finding's test is code from the pull request's branch, run here as its own tests are.
      - name: Review replays and claims checker acceptances new since the base, re-executed at their commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          BASE_SHA=${BASE_SHA:-$(git rev-parse "$GITHUB_SHA^1")}
          python tools/review.py verify --base "$BASE_SHA"
          python tools/claims.py verify --base "$BASE_SHA"

  mutants:
    needs: wheels
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    name: mutants (${{ matrix.part }}/4)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: ./.github/actions/install
        with:
          digest: ${{ needs.wheels.outputs.digest }}

      - name: Mutants, one part (each must fail its own case)
        run: python tests/mutants.py --shard ${{ matrix.part }}/4 --matrix "$RUNNER_TEMP/mutants-${{ matrix.part }}.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matrix-${{ matrix.part }}
          path: ${{ runner.temp }}/mutants-${{ matrix.part }}.json
          if-no-files-found: error
          retention-days: 3

  test:
    needs: [wheels, suites, mutants, replay]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A skipped required check would read as passed: this job always runs and refuses here.
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          got = {j: n["result"] for j, n in needs.items()}
          print("jobs:", ", ".join(f"{j}={r}" for j, r in sorted(got.items())))
          bad = {j: r for j, r in got.items() if r != "success"}
          sys.exit(f"not every job succeeded: {bad}" if bad or len(got) != 4 else 0)'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0              # the claims view compares each acceptance's commit with this tree
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: ./.github/actions/install
        with:
          digest: ${{ needs.wheels.outputs.digest }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: matrix-*
          path: ${{ runner.temp }}/parts
          merge-multiple: true

      - name: The mutant parts together ran every mutant once, each killed on its own case
        run: python tests/mutants.py --merge "$RUNNER_TEMP/matrix.json" "$RUNNER_TEMP"/parts/mutants-*.json

      # After the mutants, so the mutant ids the claims cite have just been exercised.
      - name: The claims of docs/V3.md, the roadmap, the pilot contract (records in .warrant/records.jsonl)
        run: |
          set -euo pipefail
          python tools/claims.py check
          python tools/roadmap.py check
          python tools/pilot.py check

      - name: Views of the records (CLAIMS.md, ROADMAP.md, REVIEWS.md), deterministic
        run: python tools/graph.py views --check

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: views
          path: build/views
          if-no-files-found: error
          retention-days: 30

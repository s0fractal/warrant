name: ci

# Warrant 2. The job id `test` is a required status check on master; keep it.
#
# Two installs, both from local files:
#   base     warrant alone: attest and observe work, compute refuses honestly;
#   compute  warrant + the sigma-glyph wheel built from the commit pyproject.toml
#            names (the [compute] extra) + the pinned MCP SDK (the [mcp] extra),
#            from a wheelhouse, with --no-index.
# The tests and mutants run against the installed bytes; the scenarios run
# through the installed `warrant` command from outside the checkout.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Wheelhouse (warrant from this checkout, sigma-glyph from the pinned commit)
        run: |
          set -euo pipefail
          COMMIT=$(python -c 'import re; print(re.search(r"sigma-glyph@([0-9a-f]{40})", open("pyproject.toml").read()).group(1))')
          python -m pip wheel --quiet --no-deps -w "$RUNNER_TEMP/wh" . "git+https://github.com/s0fractal/sigma-glyph@$COMMIT"
          python -m pip download --quiet -d "$RUNNER_TEMP/wh" 'cryptography>=41' 'mcp==2.3.0'
          ls "$RUNNER_TEMP/wh"

      - name: Base install has no provider, and says so
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/base"
          "$RUNNER_TEMP/base/bin/pip" install --quiet --no-index -f "$RUNNER_TEMP/wh" warrant-loops
          ! "$RUNNER_TEMP/base/bin/python" -c 'import sigma_provider' 2>/dev/null
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/base/bin/warrant" init --store s >/dev/null
          out=$("$RUNNER_TEMP/base/bin/warrant" compute --store s provider 2>&1 || true)
          echo "$out" | grep -q "no Sigma provider installed"

      - name: Compute install (warrant + sigma-glyph wheel, no index)
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/pip" install --quiet --no-index -f "$RUNNER_TEMP/wh" 'warrant-loops[mcp]' sigma-glyph
          "$RUNNER_TEMP/v/bin/python" -m sigma_provider | tail -1
          SITE=$("$RUNNER_TEMP/v/bin/python" -c 'import pathlib, warrant; print(pathlib.Path(warrant.__file__).parent.parent)')
          echo "WARRANT_IMPL=$SITE" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/v/bin" >> "$GITHUB_PATH"

      - name: Contract, computation, conditions and primitives (installed bytes)
        working-directory: tests
        run: |
          for t in contract compute conditions primitives cli; do python "${t}_test.py"; done

      - name: Agent interface (Python API, CLI and stdio MCP over one backend; installed bytes)
        working-directory: tests
        run: |
          for t in agent_handoff agent_write agent_compute agent_mcp; do python "${t}_test.py"; done

      - name: Mutants (each critical rule must fail its own case)
        run: |
          WARRANT_IMPL= python tests/mutants.py
          WARRANT_IMPL= python tests/agent_mutants.py

      - name: Scenarios through the installed `warrant` command
        working-directory: ${{ runner.temp }}
        run: bash "$GITHUB_WORKSPACE/examples/run-all.sh"

      - name: Agent acceptance run through Python, CLI and stdio MCP (installed wheels, outside the checkout)
        working-directory: ${{ runner.temp }}
        run: |
          for d in python cli mcp; do python "$GITHUB_WORKSPACE/examples/agent/acceptance.py" --door "$d"; done

      - name: Claude Code plugin bridge (Warrant 0.x format, published warrant-verify 0.12.0)
        run: |
          python -m venv "$RUNNER_TEMP/old"
          "$RUNNER_TEMP/old/bin/pip" install --quiet 'warrant-verify==0.12.0'
          WARRANT_PLUGIN_CLI="$RUNNER_TEMP/old/bin/warrant" python integrations/claude-code-plugin/test_plugin.py

name: sigma-provider

# The Warrant ↔ Sigma boundary (SPEC §7). The job id `cross-repo` is a required
# status check on master; keep it.
#
# Warrant 0.x ran a HEAD-against-HEAD matrix here (X1) with four files mirrored
# byte for byte in both repositories. Warrant 2 consumes exactly one Sigma
# artifact: the sigma-resume kernel pinned in warrant/provider/PIN.json. This job
# checks that contract at the pinned commit, never at sigma-glyph's HEAD:
#   1. the vendored kernel bytes are the files of sigma-glyph at that commit;
#   2. sigma-glyph's own resume tests pass at that commit (its UNRUNs are named);
#   3. Warrant's computation tests pass through the provider, installed.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-repo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Fetch sigma-glyph at the pinned commit
        run: |
          set -euo pipefail
          PIN=$(python -c 'import json; print(json.load(open("warrant/provider/PIN.json"))["commit"])')
          git init -q "$RUNNER_TEMP/sigma"
          git -C "$RUNNER_TEMP/sigma" fetch -q --depth 1 https://github.com/s0fractal/sigma-glyph "$PIN"
          git -C "$RUNNER_TEMP/sigma" checkout -q FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/sigma" rev-parse HEAD)" = "$PIN"
          echo "pinned sigma-glyph: $PIN"

      - name: The vendored kernel is sigma-glyph's, byte for byte, and matches the pin
        run: |
          set -euo pipefail
          for f in sigma_glyph.py sigma_resume.py; do
            cmp "warrant/provider/$f" "$RUNNER_TEMP/sigma/impl/$f"
            want=$(python -c "import json; print(json.load(open('warrant/provider/PIN.json'))['files']['$f'])")
            got=$(sha256sum "warrant/provider/$f" | cut -d' ' -f1)
            test "$got" = "$want"
            echo "ok  $f $got"
          done

      - name: sigma-glyph's own resume tests at the pin
        working-directory: ${{ runner.temp }}/sigma
        run: |
          python tests/resume_test.py | tee "$RUNNER_TEMP/resume.log"
          grep -q "^SIGMA-RESUME: [0-9]* PASS, 0 FAIL" "$RUNNER_TEMP/resume.log"

      - name: Warrant computation tests through the installed provider
        run: |
          python -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/pip" install --quiet .
          cd tests && WARRANT_IMPL=$("$RUNNER_TEMP/v/bin/python" -c 'import pathlib, warrant; print(pathlib.Path(warrant.__file__).parent.parent)') \
            "$RUNNER_TEMP/v/bin/python" compute_test.py

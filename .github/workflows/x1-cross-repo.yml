name: sigma-provider

# The Warrant ↔ Sigma boundary (SPEC §7). The job id `cross-repo` is a required
# status check on master; keep it.
#
# One artifact-consumer scenario, at the exact sigma-glyph release pyproject.toml
# names, never sigma-glyph HEAD: that release from PyPI, installed beside warrant
# in a fresh environment, must carry the reviewed provider identity below (a
# version pin alone does not name bytes), runs its own provider self-test, and
# warrant's computation tests and the computation scenario then use it through
# the installed `warrant` command.
#
# SIGMA_PROVIDER_ID is the identity of sigma-glyph 0.8.0's provider modules
# (Codex ACCEPT of sigma-glyph #65 and #67; PyPI artifacts matched the release
# run). It is what CI checks the installed bytes against, not what a recipient
# accepts: acceptance stays in each recipient's profile.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-repo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SIGMA_PROVIDER_ID: 0caff793d00dd798fa0af89517674c2ca562e1d517e7c969cc40617778c776c5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install warrant and the pinned sigma-glyph release
        run: |
          set -euo pipefail
          SIGMA=$(python -c 'import re; print(re.search(r"sigma-glyph==([0-9][0-9.]*)", open("pyproject.toml").read()).group(1))')
          echo "sigma-glyph release: $SIGMA"
          python -m pip wheel --quiet --no-deps -w "$RUNNER_TEMP/wh" .
          python -m pip download --quiet --no-deps -d "$RUNNER_TEMP/wh" "sigma-glyph==$SIGMA"
          python -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/pip" install --quiet "$RUNNER_TEMP"/wh/*.whl
          echo "$RUNNER_TEMP/v/bin" >> "$GITHUB_PATH"

      - name: The installed provider is the reviewed one (identity, not version)
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          warrant init --store idcheck >/dev/null
          got=$(warrant compute --store idcheck provider | python -c 'import json,sys; print(json.load(sys.stdin)["provider"])')
          echo "installed provider: $got"
          test "$got" = "$SIGMA_PROVIDER_ID"

      - name: The provider's own self-test, installed
        working-directory: ${{ runner.temp }}
        run: |
          python -m sigma_provider | tee /dev/stderr | grep -q "^PROVIDER: ALL PASS"

      - name: Warrant computation tests through the installed provider
        working-directory: tests
        run: |
          WARRANT_IMPL=$(python -c 'import pathlib, warrant; print(pathlib.Path(warrant.__file__).parent.parent)') python compute_test.py

      - name: The computation scenario through the installed command
        working-directory: ${{ runner.temp }}
        run: bash "$GITHUB_WORKSPACE/examples/4-computation.sh"

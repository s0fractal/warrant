# X1 — cross-repo coupling gate (warrant <-> sigma-glyph), HEAD against HEAD.
#
# The existing conformance jobs pin the sibling BY COMMIT on purpose, and this
# workflow does NOT replace them: pinned = the reproducibility gate. But a pin is
# a snapshot, so a change on either HEAD stays invisible until a human bumps it.
# Measured 2026-07-27, the pins had drifted 19 days apart (sigma pinned three
# different warrant commits at once; warrant pinned a sigma commit older than its
# last 50 commits) and nothing anywhere ran HEAD against HEAD. X1 is that canary.
#
# A red X1 with green pinned jobs means: the seam moved, bump or fix deliberately.
#
# NOT AN INDEPENDENT GATE (AGENTS.md §3). It runs suites; it hunts no
# counter-vectors. Green here is necessary and never sufficient.
name: x1-cross-repo

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Daily. The sibling can move without touching this repo, so time — not our
    # own pushes — is the trigger that actually catches sibling-side drift.
    - cron: '17 5 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [sibling-head-moved]

concurrency:
  group: x1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-repo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24'

      - name: Install python deps
        run: >-
          pip install --quiet --only-binary=:all:
          'cryptography==45.0.7'

      - name: Clone sibling at HEAD (deliberately UNPINNED — that is the point)
        env:
          PR_HEAD_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          case "${{ github.repository }}" in
            */warrant)     SIB=sigma-glyph ;;
            */sigma-glyph) SIB=warrant ;;
            *) echo "X1: unexpected repository ${{ github.repository }}" >&2; exit 2 ;;
          esac
          URL="https://github.com/s0fractal/$SIB.git"
          # A paired same-owner PR may carry the sibling half under the same
          # branch name. Test candidate against candidate there; push/schedule
          # events still test master against master. If the paired branch is
          # absent, fall back to sibling master and let the seam fail normally.
          if [[ "${{ github.event_name }}" = "pull_request" \
             && "$PR_HEAD_OWNER" = "s0fractal" \
             && -n "$PR_HEAD_REF" \
             && $(git ls-remote --heads "$URL" "refs/heads/$PR_HEAD_REF" | wc -l) -eq 1 ]]; then
            git clone -q --depth 50 --branch "$PR_HEAD_REF" "$URL" /tmp/$SIB
            echo "X1 sibling candidate: $SIB/$PR_HEAD_REF"
          else
            git clone -q --depth 50 "$URL" /tmp/$SIB
          fi
          echo "SIBLING=/tmp/$SIB" >> "$GITHUB_ENV"
          echo "X1 sibling: $SIB @ $(git -C /tmp/$SIB rev-parse --short HEAD)"

      - name: X1 coupling matrix (HEAD vs HEAD)
        env:
          X1_SEEDS: '1 2 3'
          # Both are the defaults; they are set here anyway so the mode CI runs
          # in is visible in the workflow and cannot be changed by editing a
          # default in the script. A crossing that does not run is a failure, and
          # a missing mirror file is a failure -- there is no bootstrap window
          # left now that X1 is landed in both repositories.
          X1_DEGRADED: '0'
          X1_BOOTSTRAP: '0'
        run: bash tools/x1_cross_repo.sh

      - name: Negative control — the gate must be able to FAIL
        # Guards against a vacuous green. Each control corrupts one thing in the
        # sibling and names the X1 step that must go red; a control that finds
        # nothing to tamper, or turns a *different* step red, fails the job.
        # Covers every Book I vector kind separately, gate deletion, and an
        # unbuildable sibling — see the header of tools/x1_negative_control.sh
        # for the drafts of this file that were themselves vacuous.
        env:
          X1_DEGRADED: '0'
          X1_BOOTSTRAP: '0'
        run: bash tools/x1_negative_control.sh

name: sigma-provider

# The Warrant ↔ Sigma boundary (SPEC §7). The job id `cross-repo` is a required
# status check on master; keep it.
#
# One artifact-consumer scenario, at the exact sigma-glyph commit pyproject.toml
# names, never sigma-glyph HEAD: the sigma-glyph wheel built from that commit,
# installed beside warrant in a fresh environment, runs its own provider
# self-test; warrant's computation tests and the computation scenario then use
# it through the installed `warrant` command.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-repo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install warrant and the pinned sigma-glyph wheel
        run: |
          set -euo pipefail
          COMMIT=$(python -c 'import re; print(re.search(r"sigma-glyph@([0-9a-f]{40})", open("pyproject.toml").read()).group(1))')
          echo "sigma-glyph commit: $COMMIT"
          python -m pip wheel --quiet --no-deps -w "$RUNNER_TEMP/wh" . "git+https://github.com/s0fractal/sigma-glyph@$COMMIT"
          python -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/pip" install --quiet "$RUNNER_TEMP"/wh/*.whl
          echo "$RUNNER_TEMP/v/bin" >> "$GITHUB_PATH"

      - name: The provider's own self-test, installed
        working-directory: ${{ runner.temp }}
        run: |
          python -m sigma_provider | tee /dev/stderr | grep -q "^PROVIDER: ALL PASS"

      - name: Warrant computation tests through the installed provider
        working-directory: tests
        run: |
          WARRANT_IMPL=$(python -c 'import pathlib, warrant; print(pathlib.Path(warrant.__file__).parent.parent)') python compute_test.py

      - name: The computation scenario through the installed command
        working-directory: ${{ runner.temp }}
        run: bash "$GITHUB_WORKSPACE/examples/4-computation.sh"

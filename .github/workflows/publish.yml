name: publish

# Auto-publish `warrant-verify` to PyPI via Trusted Publishing (OIDC) — no stored
# tokens. A GitHub Release named `vX.Y.Z` builds, validates, and publishes.
# `workflow_dispatch` publishes to TestPyPI for a dry run.
# One-time PyPI setup is documented in PUBLISHING.md.
#
# The same release publishes the Rust implementation (impl-rs) to crates.io as
# the `warrant-verify` crate, also by Trusted Publishing -- once the one-time
# setup in PUBLISHING.md is done and the repository variable
# CRATES_IO_TRUSTED_PUBLISHING is "true". Until then the `crate` job still
# builds, tests and dry-runs the upload on every release and dispatch, so the
# crate cannot rot unpublished.
#
# ACTIONS ARE PINNED BY COMMIT SHA, version in the trailing comment. The `pypi`
# and `testpypi` jobs below hold `id-token: write` and mint an OIDC token that
# PyPI accepts as this repository's identity; anything running in them can use
# it. A mutable ref (`@v4`, `@release/v1`) hands that decision to whoever can
# move the tag, which for a project whose subject is provenance is the wrong
# default. Each SHA was resolved from the upstream repository and is the commit
# that ref pointed at when it was pinned; the comment is a label, the SHA is
# what runs.
#
# The trade is real and only half of it is automated away. `.github/dependabot.yml`
# now watches these pins weekly and OPENS A PULL REQUEST when a newer release
# exists — it resolves the SHA to its tag itself and rewrites the trailing
# `# vX.Y.Z` comment to match. It does not review and it does not merge. The
# jobs below hold `id-token: write`, so merging such a bump unread is a
# supply-chain change to the job that publishes this package, made without
# looking — read the upstream diff between the two SHAs first. That file lists
# what else this does not cover.

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --only-binary=:all: 'build==1.5.0' 'twine==7.0.0'
          python -m build
      - name: Version matches release tag
        if: github.event_name == 'release'
        run: |
          VER=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          echo "pyproject=$VER tag=$TAG"
          test "$VER" = "$TAG" || { echo "::error::tag v$TAG does not match pyproject version $VER"; exit 1; }
      - name: Validate metadata + that the wheel runs offline
        run: |
          twine check dist/*
          python -m venv /tmp/wv
          /tmp/wv/bin/pip install dist/*.whl
          ( cd /tmp && /tmp/wv/bin/warrant selftest )
          ( cd /tmp && /tmp/wv/bin/warrant conformance "$GITHUB_WORKSPACE/examples" | grep -q "CONFORMANCE: ALL PASS" )
      # The artifact must be able to do everything the docs tell a stranger to
      # do. 0.4.0 shipped while the README documented `verify --store-mode
      # --json` as the machine boundary; the release predated the feature, so
      # `pip install warrant-verify` + the README gave `unrecognized arguments`.
      # This step is what makes that state unpublishable rather than merely
      # regrettable.
      - name: Documented CLI surface exists in the built wheel
        run: python3 tools/check_release_surface.py --wheel "$(ls dist/*.whl)" --bin /tmp/wv/bin
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  pypi:
    # Real, irreversible publish — only from a published GitHub Release.
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write            # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  testpypi:
    # Dry run: manual trigger publishes to TestPyPI.
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  crate:
    # The crate exactly as `cargo publish` would upload it: packaged from the
    # listed files only, built and tested from that package, and refused if its
    # version disagrees with the release tag or with the Python package (one
    # tooling version, CHANGELOG.md).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Crate version matches pyproject (and the release tag)
        run: |
          CRATE=$(python3 -c "import tomllib;print(tomllib.load(open('impl-rs/Cargo.toml','rb'))['package']['version'])")
          PY=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "crate=$CRATE pyproject=$PY ref=${GITHUB_REF_NAME}"
          test "$CRATE" = "$PY" || { echo "::error::impl-rs/Cargo.toml $CRATE != pyproject $PY"; exit 1; }
          if [ "${{ github.event_name }}" = "release" ]; then
            test "$CRATE" = "${GITHUB_REF_NAME#v}" || { echo "::error::tag ${GITHUB_REF_NAME} != crate $CRATE"; exit 1; }
          fi
      - name: Package, then build and test from the packaged files
        run: |
          cd impl-rs
          cargo package --locked
          PKG=$(ls target/package/warrant-verify-*.crate)
          mkdir -p /tmp/pkg && tar xzf "$PKG" -C /tmp/pkg
          cd /tmp/pkg/warrant-verify-*/
          cargo test --release --locked
          ./target/release/warrant-rs conformance "$GITHUB_WORKSPACE/examples" | grep -q "CONFORMANCE: ALL PASS"
          ./target/release/warrant-rs selftest
      - name: Upload dry run
        run: cd impl-rs && cargo publish --dry-run --locked

  crates-io:
    # Real, irreversible publish — only from a published GitHub Release, and only
    # once crates.io trusts this workflow (PUBLISHING.md, "crates.io").
    needs: [build, crate]
    if: github.event_name == 'release' && vars.CRATES_IO_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write            # OIDC token for crates.io Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cd impl-rs && cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

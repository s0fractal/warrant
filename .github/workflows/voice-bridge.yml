# The bridge (warrant/bridge.py): an issue opened through the form .github/ISSUE_TEMPLATE/voice.yml becomes one record
# in a store of voices on the branch `voices`, signed by the bridge's key (bridge-key.yml), and the issue is answered
# with the record's id. The record says that GitHub delivered this issue, opened by this account; it is not the
# account's signature, the store gives nobody a role and no rule of any store counts it.
#
# Everything of the issue is data. No expression of the event is written into a script here: the bridge reads the
# event's file, and what is answered on the issue is text the bridge wrote from ids and its own words.
#
# The seed is in the environment of a job that runs master's code: whoever can change master's code can read it. That
# is the gate's guard, as for the claims checker. A key that leaked signs voices only: what no store counts.
name: voice-bridge

# `issues` runs the workflow of the default branch: nothing of a pull request or a fork is checked out here.
on:
  issues:
    types: [opened]

permissions: {}

# One issue at a time: each run appends to the branch the last one pushed.
concurrency:
  group: voice-bridge
  cancel-in-progress: false

jobs:
  # Whether the issue came through the form (its body starts with the form's first field). Any other issue ends here:
  # no environment, no permission, no answer.
  sift:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      voice: ${{ steps.look.outputs.voice }}
    steps:
      - name: Is it the form's body
        id: look
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          body = (json.load(open(os.environ["GITHUB_EVENT_PATH"])).get("issue") or {}).get("body")
          form = isinstance(body, str) and body.replace("\r\n", "\n").startswith("### Record\n\n")
          print("voice=" + ("true" if form else "false"))
          PY

  file:
    needs: sift
    if: needs.sift.outputs.voice == 'true'
    runs-on: ubuntu-latest
    environment: bridge
    timeout-minutes: 10
    permissions:
      contents: write          # the branch voices
      issues: write            # the answer on the issue
    env:
      GIT_AUTHOR_NAME: github-bridge
      GIT_AUTHOR_EMAIL: github-bridge@invalid
      GIT_COMMITTER_NAME: github-bridge
      GIT_COMMITTER_EMAIL: github-bridge@invalid
      READER: https://s0fractal.github.io/warrant/reader.html
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          path: code
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Signature library (exact version and hashes)
        run: python -m pip install --quiet --only-binary ':all:' --require-hashes -r code/.github/merge-gate-requirements.txt
      - name: File the voice, publish the store, answer the issue
        env:
          WARRANT_BRIDGE_SEED: ${{ secrets.WARRANT_BRIDGE_SEED }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          number=$(python -c 'import json, os; n = json.load(open(os.environ["GITHUB_EVENT_PATH"]))["issue"]["number"]; assert type(n) is int and n > 0; print(n)')
          answer() { gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$1"; }
          if [ -z "$WARRANT_BRIDGE_SEED" ]; then
            echo "The bridge has no key yet (the environment bridge holds no WARRANT_BRIDGE_SEED: bridge-key.yml has not run). Nothing was filed." > "$RUNNER_TEMP/answer.md"
            cat "$RUNNER_TEMP/answer.md" >> "$GITHUB_STEP_SUMMARY"
            answer "$RUNNER_TEMP/answer.md"
            exit 0
          fi
          gh auth setup-git
          git init -q voices
          git -C voices remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          if git -C voices fetch -q --depth 1 origin voices; then
            git -C voices checkout -q -b voices FETCH_HEAD
          else
            git -C voices checkout -q --orphan voices
            printf '%s\n' "# A store of voices" "" \
              "Written by \`.github/workflows/voice-bridge.yml\` of the default branch (\`warrant/bridge.py\`): one record for each issue opened through the form *A voice on a record*." \
              "Each record says that GitHub delivered that issue, opened by that account. It is not the account's signature, and no rule of any store counts it." \
              "" "Read it beside another store: $READER?with=https%3A%2F%2Fraw.githubusercontent.com%2F${GITHUB_REPOSITORY%%/*}%2F${GITHUB_REPOSITORY##*/}%2Fvoices%2F" > voices/README.md
          fi
          set +e
          PYTHONPATH="$GITHUB_WORKSPACE/code" python -m warrant.bridge file --event "$GITHUB_EVENT_PATH" --store voices \
            --reader "$READER" --voices "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/voices/" > "$RUNNER_TEMP/out.json"
          rc=$?
          set -e
          if [ "$rc" != 0 ] && [ "$rc" != 3 ]; then
            echo "the bridge could not file (status $rc):" >&2
            cat "$RUNNER_TEMP/out.json" >&2
            exit 1
          fi
          python -c 'import json, sys; print(json.load(open(sys.argv[1]))["comment"])' "$RUNNER_TEMP/out.json" > "$RUNNER_TEMP/answer.md"
          if [ "$rc" = 0 ]; then
            git -C voices add README.md .warrant
            if ! git -C voices diff --cached --quiet; then
              git -C voices commit -q -m "voice: issue #$number"
              git -C voices push -q origin voices
            fi
          fi
          answer "$RUNNER_TEMP/answer.md"
          cat "$RUNNER_TEMP/answer.md" >> "$GITHUB_STEP_SUMMARY"

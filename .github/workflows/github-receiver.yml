name: github-receiver

# A receiver for the dependency-audit handoff on a host the owner does not
# control: a GitHub-hosted runner. The carrier is this repository's own
# refs/warrant/* namespace. The runner delivers a packet to itself only under a
# pin signed by the owner (examples/ref-transport/allowed_signers), runs the
# audit with its own fresh key, provider and profile, sends the reply back as a
# ref, and attests the reply bytes with GitHub's Sigstore provenance, so that
# anyone can check which workflow run, at which commit, produced them.
#
# Trigger: push a branch named receiver/github-runner/<packet sha256> at the
# commit whose runner should receive (works before this file is on the default
# branch), or dispatch by hand with the digest once it is. Either way the name or
# input only selects; the pin decides what is delivered.
on:
  push:
    branches: ['receiver/github-runner/**']
  workflow_dispatch:
    inputs:
      packet_sha256:
        description: the packet digest the owner pinned for receiver "github-runner"
        required: true

permissions:
  contents: write       # push the reply ref (refs/warrant/out/github-runner/...)
  id-token: write       # Sigstore signing identity for the attestation
  attestations: write

jobs:
  receive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MANIFEST_PIN: 7d722e2664dc57f1618b3bd7c47d3ffbb77d775f770315a8ebc1dcf0b6645653
      PROVIDER: 0caff793d00dd798fa0af89517674c2ca562e1d517e7c969cc40617778c776c5
      SELECTOR: ${{ inputs.packet_sha256 || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install warrant from this checkout with the pinned sigma-glyph release
        run: |
          set -euo pipefail
          python -m pip install --quiet '.[compute]' 'packaging==26.3'
          python -m sigma_provider | tail -1
          python -c 'import warrant.compute as P; p=P.Provider.capture(); assert p.id == "'"$PROVIDER"'", p.id; print("provider", p.id)'

      - name: Fetch the exact public wheels of the frozen kit
        run: |
          set -euo pipefail
          python examples/dependency-audit/audit.py fetch --manifest examples/dependency-audit/fixture/manifest.json \
            --manifest-sha256 "$MANIFEST_PIN" --wheelhouse "$RUNNER_TEMP/wheels" | grep -E '"binding"|"provider_check"'

      - name: Fetch what the owner pinned for this receiver
        id: fetch
        run: |
          set -euo pipefail
          python examples/ref-transport/carry.py fetch --repo "$RUNNER_TEMP/carrier-in" \
            --remote "https://github.com/${GITHUB_REPOSITORY}.git" --me github-runner \
            --allowed-signers examples/ref-transport/allowed_signers --out "$RUNNER_TEMP/inbox" | tee "$RUNNER_TEMP/fetch-stdout.json"
          WANT="${SELECTOR##*/}"      # the digest, from the input or the branch name
          PIN=$(python -c 'import json,sys; d=json.load(open(sys.argv[1])); x=[r for r in d["deliveries"] if r["delivered"] and r["kind"]=="packet" and r["principal"]=="owner" and r["sha256"]==sys.argv[2]]; print(x[0]["sha256"]) if len(x)==1 else sys.exit(3)' "$RUNNER_TEMP/fetch-stdout.json" "$WANT")
          echo "pinned=$PIN" >> "$GITHUB_OUTPUT"

      - name: Receive on this host (own key, provider and profile), binding controls, checked resume
        run: |
          set -euo pipefail
          PIN='${{ steps.fetch.outputs.pinned }}'
          python examples/dependency-audit/handoff.py receive --work "$RUNNER_TEMP/receiver" \
            --packet "$RUNNER_TEMP/inbox/$PIN.json" --packet-sha256 "$PIN" --manifest-sha256 "$MANIFEST_PIN" \
            --accept-provider "$PROVIDER" --wheelhouse "$RUNNER_TEMP/wheels" --reply "$RUNNER_TEMP/reply.json" \
            > "$RUNNER_TEMP/receive-stdout.json"
          python -c 'import json,sys; d=json.load(open(sys.argv[1])); print(json.dumps({k: v["verdict"] for k, v in d["results"].items()}))' "$RUNNER_TEMP/receive-stdout.json"
          sha256sum "$RUNNER_TEMP/reply.json"
          uname -srm > "$RUNNER_TEMP/host.txt"; python --version >> "$RUNNER_TEMP/host.txt"; grep PRETTY /etc/os-release >> "$RUNNER_TEMP/host.txt"
          echo "run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT} sha ${GITHUB_SHA}" >> "$RUNNER_TEMP/host.txt"

      - name: Send the reply back over the carrier
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python examples/ref-transport/carry.py send --repo "$RUNNER_TEMP/carrier-out" \
            --remote "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            --from github-runner --to producer --file "$RUNNER_TEMP/reply.json" | tee "$RUNNER_TEMP/send-stdout.json"

      - name: Attest the reply bytes (Sigstore provenance of this run)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/reply.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-receiver-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/reply.json
            ${{ runner.temp }}/fetch-stdout.json
            ${{ runner.temp }}/receive-stdout.json
            ${{ runner.temp }}/send-stdout.json
            ${{ runner.temp }}/host.txt

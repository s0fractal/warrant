name: agent-gate

# The change under review is data, never code — including this file.
#
# Two rounds of the same defect. First the workflow checked out the pull request
# and ran the gate from it, so a change could rewrite `.warrant/gate.wpl` into a
# tautology and award itself an ACCEPT. That was fixed by reading the rule from
# the base revision — and the hole moved up a level: on `pull_request`, GitHub
# takes the workflow itself from the pull request, so a change could still
# rewrite *this file*, restore a head checkout, and fabricate a comment. The
# defendant had stopped editing the judge and was still editing the courtroom.
#
# `pull_request_target` runs the workflow, and checks out the code, from the base
# branch. That is only safe under one condition, which this file keeps: the head
# is never executed. It is fetched as a git object, diffed, and read for commit
# trailers, and nothing more. See GitHub's own guidance on securely using
# pull_request_target.

on:
  pull_request_target:

permissions: {}

jobs:
  verdict:
    runs-on: ubuntu-latest
    permissions:
      contents: read          # no write capability anywhere near the computation
    steps:
      - name: Check out the BASE revision — the gate's own code and rule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      # refs/pull/<n>/head rather than the head SHA: for a pull request from a
      # fork the commit does not exist in this repository under any other name.
      - name: Fetch the proposed commit as data, never as code
        run: |
          git fetch --no-tags origin \
            "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/pr/head"
          git rev-parse refs/remotes/pr/head

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the verifier the way a stranger would
        run: pip install "--only-binary=:all:" warrant-verify==0.9.0

      - name: Decide, from the base revision's rule
        run: |
          python3 tools/gate.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head refs/remotes/pr/head \
            --policy-from "${{ github.event.pull_request.base.sha }}" \
            --pack gate-store.zip \
            --out gate-report.md || true
          cat gate-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the report and the blobs that decided
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-store
          path: |
            gate-report.md
            gate-store.zip

  comment:
    needs: verdict
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write    # this job downloads an artifact and posts it, nothing else
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gate-store

      - name: Post the report, updating the previous one
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('gate-report.md')) return;
            const body = fs.readFileSync('gate-report.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments(
              { owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number });
            const mine = comments.find(c => c.body.startsWith('# Gate report'));
            if (mine) {
              await github.rest.issues.updateComment(
                { owner: context.repo.owner, repo: context.repo.repo,
                  comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment(
                { owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: context.issue.number, body });
            }

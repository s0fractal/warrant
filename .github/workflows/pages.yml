name: browser-verifier

on:
  push:
    branches: [master]
    paths: ['impl-rs/**', 'impl-wasm/**', 'web/**', 'js/**', 'examples/ski/**', 'docs/conformance.html', '.github/workflows/pages.yml']
  pull_request:
    paths: ['impl-rs/**', 'impl-wasm/**', 'web/**', 'js/**', 'examples/ski/**', 'docs/conformance.html', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.13'}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22'}
      - name: Install the pinned WASM binding tool and reference dependency
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.104 --locked
          python3 -m pip install --only-binary=:all: cryptography==45.0.7
      - name: Native core tests and file/memory parity
        run: |
          cargo test --manifest-path impl-rs/Cargo.toml --locked
          cargo clippy --manifest-path impl-rs/Cargo.toml --all-targets --locked -- -D warnings
          cargo clippy --manifest-path impl-wasm/Cargo.toml --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Build and exercise the actual WASM against the reference
        run: |
          python3 web/build.py
          cd web
          npm test
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with: { deno-version: v2.x }
      - name: Build and test the portable npm and JSR package
        run: |
          cargo build --release --locked --manifest-path impl-rs/Cargo.toml
          python3 js/build.py
          npm --prefix js test
          npm pack ./js --dry-run
          (cd js && deno check mod.ts && deno publish --dry-run --allow-dirty)
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: {path: web/dist}

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment

name: browser-verifier

on:
  push:
    branches: [master]
    paths: ['impl-rs/**', 'impl-wasm/**', 'web/**', 'examples/ski/**', 'docs/conformance.html', '.github/workflows/pages.yml']
  pull_request:
    paths: ['impl-rs/**', 'impl-wasm/**', 'web/**', 'examples/ski/**', 'docs/conformance.html', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.13'}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22'}
      - name: Install the pinned WASM binding tool and reference dependency
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.104 --locked
          python3 -m pip install --only-binary=:all: cryptography==45.0.7
      - name: Native core tests and file/memory parity
        run: |
          cargo test --manifest-path impl-rs/Cargo.toml --locked
          cargo clippy --manifest-path impl-rs/Cargo.toml --all-targets --locked -- -D warnings
          cargo clippy --manifest-path impl-wasm/Cargo.toml --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Build and exercise the actual WASM against the reference
        run: |
          python3 web/build.py
          cd web
          npm test
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: {path: web/dist}

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment

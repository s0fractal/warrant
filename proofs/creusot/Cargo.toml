[package]
name = "warrant-creusot-proofs"
version = "0.1.0"
edition = "2021"
publish = false

# Proves impl-rs/src/hexcanon.rs and bounds.rs with Creusot. Not part of any build: run
# `cargo creusot` here (README.md). creusot-std resolves through the
# [patch] that Creusot's installer writes to ~/.cargo/config.toml.

[workspace]

[dependencies]
creusot-std = "0.15.0-dev"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(creusot)'] }
